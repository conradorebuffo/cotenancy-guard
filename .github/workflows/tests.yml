name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: git --version && python --version && python -m pip install pytest
        shell: bash
      # On failure, the tail of the pytest output also goes out as an error annotation, so it
      # can be read from the API without downloading the job log.
      - run: |
          set -o pipefail
          python -m pytest -q -rf --tb=short 2>&1 | tee pytest.out || {
            echo "::error title=pytest::$(tail -n 60 pytest.out | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
        shell: bash
